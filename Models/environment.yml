name: acne-detection
channels:
  - conda-forge
  - defaults

dependencies:
  - python=3.10

  # Core data science
  - numpy
  - pandas
  - matplotlib
  - scikit-learn
  - scipy

  # Jupyter
  - jupyter
  - ipykernel

  # pip dependencies
  - pip
  - pip:
      # YOLO
      - ultralytics

      # Deep Learning (PyTorch stack)
      - torch
      - torchvision

      # Optimization
      - optuna
      - pyyaml

      # Utilities
      - tqdm
      - pillow
      - opencv-python-headless

      # Optional logging
      - tensorboard