name: acne-detection
channels:
  - conda-forge
  - defaults

dependencies:
  - python=3.10

  # Core data science
  - numpy
  - pandas
  - matplotlib
  - scikit-learn
  - scipy

  # Jupyter
  - jupyter
  - ipykernel

  # pip dependencies
  - pip
  - pip:
      # YOLO & Computer Vision
      - ultralytics
      - opencv-python-headless
      - seaborn

      # Deep Learning (PyTorch stack)
      - torch
      - torchvision
      - torchaudio

      # Optimization & Config
      - optuna
      - pyyaml
      - sahi

      # Utilities
      - tqdm
      - pillow
      - requests
      - imagehash
      - pybktree

      # Optional logging
      - tensorboard